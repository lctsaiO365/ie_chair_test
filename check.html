<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>IE WIP Dashboard</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 25px;
    }

    .controls {
      margin-bottom: 20px;
    }

    select,
    button {
      font-size: 16px;
      padding: 8px 12px;
      margin-left: 5px;
    }

    button {
      cursor: pointer;
    }

    .cards {
      display: flex;
      gap: 20px;
      margin: 25px 0;
    }

    .card {
      flex: 1;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      text-align: center;
      background: #fafafa;
    }

    .card-title {
      font-size: 18px;
      color: #555;
      margin-bottom: 10px;
    }

    .value {
      font-size: 36px;
      font-weight: bold;
    }

    .material {
      color: #2563eb;
    }

    .product {
      color: #16a34a;
    }

    .status {
      margin: 10px 0;
      color: #666;
    }

    .chart-container {
      margin-top: 30px;
    }

    canvas {
      margin-top: 20px;
    }

    @media (max-width: 700px) {

      .cards {
        flex-direction: column;
      }

    }

  </style>

</head>


<body>

<h1>IE WIP Dashboard</h1>


<!-- ==========================
     Group 選擇
========================== -->

<div class="controls">

  Group：

  <select id="groupSelect">

    <option value="G01">G01</option>
    <option value="G02">G02</option>
    <option value="G03" selected>G03</option>
    <option value="G04">G04</option>
    <option value="G05">G05</option>
    <option value="G06">G06</option>
    <option value="G07">G07</option>
    <option value="G08">G08</option>
    <option value="G09">G09</option>
    <option value="G10">G10</option>
    <option value="G11">G11</option>
    <option value="G12">G12</option>

  </select>


  <button onclick="loadData()">
    立即更新
  </button>

</div>


<!-- ==========================
     KPI Cards
========================== -->

<div class="cards">


  <!-- Material WIP -->

  <div class="card">

    <div class="card-title">
      Material WIP
    </div>

    <div
      class="value material"
      id="materialWIP">

      -

    </div>

  </div>


  <!-- Product WIP -->

  <div class="card">

    <div class="card-title">
      Product WIP
    </div>

    <div
      class="value product"
      id="productWIP">

      -

    </div>

  </div>


</div>


<!-- ==========================
     更新時間
========================== -->

<div class="status">

  最後更新：

  <span id="lastUpdate">
    -
  </span>

</div>


<!-- ==========================
     Station Chart
========================== -->

<div class="chart-container">

  <h2>
    各工作站 WIP
  </h2>

  <canvas id="stationChart"></canvas>

</div>


<script>


// ==========================================
// Supabase 設定
// ==========================================

const SUPABASE_URL =
  "https://iomsrjkrvuzrsluirtdj.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_QmLToEOs4wEEPBnASz0dxg_o0hhtgLO";


let stationChart = null;


// ==========================================
// 從 Supabase 讀取 Buffer
// ==========================================

async function loadData() {

  const url =
    SUPABASE_URL +
    "/rest/v1/buffer?select=*";

  console.log("查詢 URL：", url);

  try {

    const response =
      await fetch(url, {

        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Content-Type":
            "application/json"
        }

      });


    console.log(
      "HTTP Status:",
      response.status
    );


    const text =
      await response.text();


    console.log(
      "Supabase 回傳：",
      text
    );


    if (!response.ok) {

      throw new Error(
        "Supabase API Error: " +
        response.status +
        " / " +
        text
      );

    }


    const data =
      JSON.parse(text);


    console.log(
      "Buffer 筆數：",
      data.length
    );


    console.log(
      "Buffer 資料：",
      data
    );


  } catch (error) {

    console.error(
      "讀取 buffer 失敗：",
      error
    );

  }

}
loadData();



// ==========================================
// 每 10 秒自動更新
// ==========================================

setInterval(

  loadData,

  10000

);


</script>

</body>

</html>
