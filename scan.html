<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IE Chair Production</title>

  <!-- CSS 寫在這裡 -->
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    button {
      font-size: 20px;
      padding: 15px 25px;
    }
  </style>

</head>

<body>

  <!-- ===================== -->
  <!-- HTML 寫在這裡 -->
  <!-- ===================== -->

  <h1>IE Chair Production</h1>

  <p>Group：<span id="group"></span></p>
  <p>Product：<span id="product"></span></p>
  <p>Station：<span id="station"></span></p>

  <button id="startBtn">START</button>
  <button id="finishBtn" disabled>FINISH</button>

  <p id="status">等待操作</p>


  <!-- ===================== -->
  <!-- JavaScript 寫在這裡 -->
  <!-- ===================== -->

  <script>

    const SUPABASE_URL =
      "https://iomsrjkrvuzrsluirtdj.supabase.co";

    const SUPABASE_KEY =
      "這裡放你的 Publishable key";


    // 讀取網址參數
    const params =
      new URLSearchParams(window.location.search);

    const group = params.get("group");
    const product = params.get("product");
    const station = params.get("station");


    // 顯示在網頁上
    document.getElementById("group").textContent = group;
    document.getElementById("product").textContent = product;
    document.getElementById("station").textContent = station;


    let startTime = null;


    // START
    document
      .getElementById("startBtn")
      .addEventListener("click", function () {

        startTime = new Date();

        document.getElementById("status").textContent =
          "作業開始：" + startTime.toLocaleTimeString();

        document.getElementById("startBtn").disabled = true;
        document.getElementById("finishBtn").disabled = false;

      });


    // FINISH
    document
      .getElementById("finishBtn")
      .addEventListener("click", async function () {

        const finishTime = new Date();

        const durationSec =
          (finishTime - startTime) / 1000;

        const data = {
          group_id: group,
          product_id: product,
          station_id: station,
          start_time: startTime.toISOString(),
          finish_time: finishTime.toISOString(),
          duration_sec: durationSec,
          status: "COMPLETED"
        };


        const response = await fetch(
          SUPABASE_URL + "/rest/v1/events",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "apikey": sb_publishable_QmLToEOs4wEEPBnASz0dxg_o0hhtgLO,
              "Authorization": "Bearer " + SUPABASE_KEY,
              "Prefer": "return=minimal"
            },

            body: JSON.stringify(data)
          }
        );


        if (response.ok) {

          document.getElementById("status").textContent =
            "資料上傳成功！作業時間：" +
            durationSec.toFixed(1) +
            " 秒";

        } else {

          const errorText = await response.text();

          document.getElementById("status").textContent =
            "上傳失敗：" + errorText;

        }

      });

  </script>

</body>
</html>
