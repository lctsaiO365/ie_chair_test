<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IE Chair Production</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    button {
      font-size: 20px;
      padding: 15px 25px;
      margin: 10px 5px;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>IE Chair Production</h1>

  <p>Group：<span id="group"></span></p>
  <p>Product：<span id="product"></span></p>
  <p>Station：<span id="station"></span></p>

  <button id="startBtn">START</button>
  <button id="finishBtn" disabled>FINISH</button>

  <p id="status">等待操作</p>

  <script>
    const SUPABASE_URL = "請貼上你的 Supabase Project URL";
    const SUPABASE_KEY = "請貼上你的 Publishable key";

    const params = new URLSearchParams(window.location.search);

    const group = params.get("group");
    const product = params.get("product");
    const station = params.get("station");

    document.getElementById("group").textContent = group;
    document.getElementById("product").textContent = product;
    document.getElementById("station").textContent = station;

    let startTime = null;

    document.getElementById("startBtn").addEventListener("click", function () {

      startTime = new Date();

      document.getElementById("status").textContent =
        "作業開始：" + startTime.toLocaleTimeString();

      document.getElementById("startBtn").disabled = true;
      document.getElementById("finishBtn").disabled = false;
    });

    document.getElementById("finishBtn").addEventListener("click", async function () {

      if (!startTime) {
        alert("請先按 START");
        return;
      }

      const finishTime = new Date();

      const durationSec =
        (finishTime.getTime() - startTime.getTime()) / 1000;

      document.getElementById("status").textContent = "資料上傳中...";

      const data = {
        group_id: group,
        product_id: product,
        station_id: station,
        start_time: startTime.toISOString(),
        finish_time: finishTime.toISOString(),
        duration_sec: durationSec,
        status: "COMPLETED"
      };

      try {

        const response = await fetch(
          const SUPABASE_URL = "https://iomsrjkrvuzrsluirtdj.supabase.co";
          SUPABASE_URL + "/rest/v1/events",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "apikey": "sb_publishable_QmLToEOs4wEEPBnASz0dxg_o0hhtgLO",
              "Authorization": "Bearer " + SUPABASE_KEY,
              "Prefer": "return=minimal"
            },

            body: JSON.stringify(data)
          }
        );

        if (response.ok) {

          document.getElementById("status").textContent =
            "資料上傳成功！作業時間：" +
            durationSec.toFixed(1) +
            " 秒";

          document.getElementById("finishBtn").disabled = true;

        } else {

          const errorText = await response.text();

          document.getElementById("status").textContent =
            "上傳失敗：" + errorText;
        }

      } catch (error) {

        document.getElementById("status").textContent =
          "連線錯誤：" + error.message;
      }
    });
  </script>

</body>
</html>
