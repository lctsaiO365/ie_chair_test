<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IE Chair Production</title>
</head>

<body>

  <h1>IE Chair Production</h1>

  <p>Group：<span id="group"></span></p>
  <p>Product：<span id="product"></span></p>
  <p>Station：<span id="station"></span></p>

  <button id="startBtn">START</button>
  <button id="finishBtn">FINISH</button>

  <p id="status">等待操作</p>

  <script>
    const params = new URLSearchParams(window.location.search);

    const group = params.get("group");
    const product = params.get("product");
    const station = params.get("station");

    document.getElementById("group").textContent = group;
    document.getElementById("product").textContent = product;
    document.getElementById("station").textContent = station;

    document.getElementById("startBtn").addEventListener("click", function () {
      document.getElementById("status").textContent = "作業開始";
    });

    document.getElementById("finishBtn").addEventListener("click", function () {
      document.getElementById("status").textContent = "作業完成";
    });
  </script>

</body>
</html>
