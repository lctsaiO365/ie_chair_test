<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>IE WIP Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 25px;
    }

    .controls {
      margin-bottom: 20px;
    }

    select,
    button {
      font-size: 16px;
      padding: 8px 12px;
      margin-left: 5px;
    }

    button {
      cursor: pointer;
    }

    .cards {
      display: flex;
      gap: 20px;
      margin: 25px 0;
    }

    .card {
      flex: 1;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      text-align: center;
      background: #fafafa;
    }

    .card-title {
      font-size: 18px;
      color: #555;
      margin-bottom: 10px;
    }

    .value {
      font-size: 36px;
      font-weight: bold;
    }

    .material {
      color: #2563eb;
    }

    .product {
      color: #16a34a;
    }

    .cycle {
      color: #dc2626;
    }

    .status {
      margin: 10px 0;
      color: #666;
    }

    .chart-container {
      margin-top: 30px;
    }

    .chart-box {
      margin-top: 40px;
    }

    canvas {
      margin-top: 20px;
    }

    @media (max-width: 700px) {

      .cards {
        flex-direction: column;
      }

    }

  </style>

</head>


<body>

<h1>IE WIP Dashboard</h1>


<!-- ==========================
     Group 選擇
========================== -->

<div class="controls">

  Group：

  <select id="groupSelect">

    <option value="G01">G01</option>
    <option value="G02">G02</option>
    <option value="G03" selected>G03</option>
    <option value="G04">G04</option>
    <option value="G05">G05</option>
    <option value="G06">G06</option>
    <option value="G07">G07</option>
    <option value="G08">G08</option>
    <option value="G09">G09</option>
    <option value="G10">G10</option>
    <option value="G11">G11</option>
    <option value="G12">G12</option>

  </select>


  <button onclick="loadData()">
    立即更新
  </button>

</div>


<!-- ==========================
     KPI Cards
========================== -->

<div class="cards">


  <!-- Material WIP -->

  <div class="card">

    <div class="card-title">
      Material WIP
    </div>

    <div
      class="value material"
      id="materialWIP">

      -

    </div>

  </div>


  <!-- Product WIP -->

  <div class="card">

    <div class="card-title">
      Product WIP
    </div>

    <div
      class="value product"
      id="productWIP">

      -

    </div>

  </div>


  <!-- Average Cycle Time -->

  <div class="card">

    <div class="card-title">
      Average Cycle Time
    </div>

    <div
      class="value cycle"
      id="cycleTime">

      -

    </div>

  </div>

</div>


<!-- ==========================
     更新時間
========================== -->

<div class="status">

  最後更新：

  <span id="lastUpdate">
    -
  </span>

</div>


<!-- ==========================
     Station WIP Chart
========================== -->

<div class="chart-container">

  <h2>
    各工作站 WIP
  </h2>

  <canvas id="stationChart"></canvas>

</div>


<!-- ==========================
     Station Cycle Time
========================== -->

<div class="chart-container chart-box">

  <h2>
    各工作站 Cycle Time
  </h2>

  <canvas id="cycleTimeChart"></canvas>

</div>


<script>


// ==========================================
// Supabase 設定
// ==========================================

const SUPABASE_URL =
  "https://iomsrjkrvuzrsluirtdj.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_QmLToEOs4wEEPBnASz0dxg_o0hhtgLO";


let stationChart = null;

let cycleTimeChart = null;


// ==========================================
// 載入所有資料
// ==========================================

async function loadData() {


  const group =
    document
      .getElementById("groupSelect")
      .value;


  try {


    // ======================================
    // 同時讀取 Buffer + Events
    // ======================================

    const bufferData =
      await loadBufferData(group);


    const eventData =
      await loadEventData(group);


    console.log(
      "Buffer data:",
      bufferData
    );


    console.log(
      "Event data:",
      eventData
    );


    // ======================================
    // WIP KPI
    // ======================================

    calculateKPI(bufferData);


    // ======================================
    // Station WIP
    // ======================================

    drawStationChart(bufferData);


    // ======================================
    // Average Cycle Time
    // ======================================

    calculateCycleTime(eventData);


    // ======================================
    // Station Cycle Time
    // ======================================

    drawCycleTimeChart(eventData);


    // ======================================
    // 更新時間
    // ======================================

    document
      .getElementById("lastUpdate")
      .textContent =
      new Date()
        .toLocaleTimeString();

  }


  catch (error) {

    console.error(error);


    document
      .getElementById("materialWIP")
      .textContent =
      "ERROR";


    document
      .getElementById("productWIP")
      .textContent =
      "ERROR";


    document
      .getElementById("cycleTime")
      .textContent =
      "ERROR";

  }

}


// ==========================================
// 讀取 Buffer
// ==========================================

async function loadBufferData(group) {


  const url =
    SUPABASE_URL +
    "/rest/v1/buffer" +
    "?select=*" +
    "&group_id=eq." +
    encodeURIComponent(group);


  const response =
    await fetch(

      url,

      {

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            SUPABASE_KEY

        }

      }

    );


  if (!response.ok) {

    throw new Error(
      "Buffer 讀取失敗：" +
      response.status
    );

  }


  return await response.json();

}


// ==========================================
// 讀取 Events
// ==========================================

async function loadEventData(group) {


  const url =
    SUPABASE_URL +
    "/rest/v1/events" +
    "?select=*" +
    "&group_id=eq." +
    encodeURIComponent(group) +
    "&status=eq.COMPLETED";


  const response =
    await fetch(

      url,

      {

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            SUPABASE_KEY

        }

      }

    );


  if (!response.ok) {

    throw new Error(
      "Events 讀取失敗：" +
      response.status
    );

  }


  return await response.json();

}


// ==========================================
// Material / Product WIP
// ==========================================

function calculateKPI(data) {


  const materialWIP =
    data.reduce(

      (sum, row) =>

        sum +
        Number(
          row.material_buffer || 0
        ),

      0

    );


  const productWIP =
    data.reduce(

      (sum, row) =>

        sum +
        Number(
          row.product_buffer || 0
        ),

      0

    );


  document
    .getElementById("materialWIP")
    .textContent =
    materialWIP.toLocaleString();


  document
    .getElementById("productWIP")
    .textContent =
    productWIP.toLocaleString();

}


// ==========================================
// Station WIP Chart
// ==========================================

function drawStationChart(data) {


  const stationData = {};


  data.forEach(row => {


    const station =
      row.station_id;


    const material =
      Number(
        row.material_buffer || 0
      );


    const product =
      Number(
        row.product_buffer || 0
      );


    if (!stationData[station]) {

      stationData[station] = {

        material: 0,

        product: 0

      };

    }


    stationData[station].material +=
      material;


    stationData[station].product +=
      product;

  });


  const stations =
    Object.keys(stationData)
      .sort();


  const materialValues =
    stations.map(

      station =>
        stationData[station].material

    );


  const productValues =
    stations.map(

      station =>
        stationData[station].product

    );


  if (stationChart) {

    stationChart.destroy();

  }


  const ctx =
    document
      .getElementById(
        "stationChart"
      );


  stationChart =
    new Chart(

      ctx,

      {

        type: "bar",

        data: {

          labels:
            stations,

          datasets: [

            {

              label:
                "Material WIP",

              data:
                materialValues,

              backgroundColor:
                "#2563eb"

            },

            {

              label:
                "Product WIP",

              data:
                productValues,

              backgroundColor:
                "#16a34a"

            }

          ]

        },

        options: {

          responsive: true,

          scales: {

            y: {

              beginAtZero: true,

              title: {

                display: true,

                text: "WIP"

              }

            }

          }

        }

      }

    );

}


// ==========================================
// Average Cycle Time
// ==========================================

function calculateCycleTime(data) {


  if (!data.length) {

    document
      .getElementById("cycleTime")
      .textContent =
      "-";

    return;

  }


  const validData =
    data.filter(

      row =>
        Number(row.duration_sec) > 0

    );


  if (!validData.length) {

    document
      .getElementById("cycleTime")
      .textContent =
      "-";

    return;

  }


  const totalSeconds =
    validData.reduce(

      (sum, row) =>

        sum +
        Number(
          row.duration_sec
        ),

      0

    );


  const averageSeconds =
    totalSeconds /
    validData.length;


  const averageMinutes =
    averageSeconds / 60;


  document
    .getElementById("cycleTime")
    .textContent =
    averageMinutes.toFixed(1) +
    " min";

}


// ==========================================
// Station Cycle Time Chart
// ==========================================

function drawCycleTimeChart(data) {


  const stationData = {};


  data.forEach(row => {


    const station =
      row.station_id;


    const duration =
      Number(
        row.duration_sec
      );


    if (
      !station ||
      !Number.isFinite(duration) ||
      duration <= 0
    ) {

      return;

    }


    if (!stationData[station]) {

      stationData[station] = {

        total: 0,

        count: 0

      };

    }


    stationData[station].total +=
      duration;


    stationData[station].count +=
      1;

  });


  const stations =
    Object.keys(stationData)
      .sort();


  const cycleTimeValues =
    stations.map(

      station => {

        const averageSeconds =
          stationData[station].total /
          stationData[station].count;


        return Number(
          (
            averageSeconds / 60
          ).toFixed(1)
        );

      }

    );


  if (cycleTimeChart) {

    cycleTimeChart.destroy();

  }


  const ctx =
    document
      .getElementById(
        "cycleTimeChart"
      );


  cycleTimeChart =
    new Chart(

      ctx,

      {

        type: "bar",

        data: {

          labels:
            stations,

          datasets: [

            {

              label:
                "Average Cycle Time (min)",

              data:
                cycleTimeValues,

              backgroundColor:
                "#dc2626"

            }

          ]

        },

        options: {

          responsive: true,

          scales: {

            y: {

              beginAtZero: true,

              title: {

                display: true,

                text: "Minutes"

              }

            }

          }

        }

      }

    );

}


// ==========================================
// Group 改變
// ==========================================

document
  .getElementById(
    "groupSelect"
  )
  .addEventListener(
    "change",
    loadData
  );


// ==========================================
// 第一次開啟
// ==========================================

loadData();


// ==========================================
// 每 10 秒自動更新
// ==========================================

setInterval(

  loadData,

  10000

);

</script>

</body>

</html>
