<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>IE Chair Production</title>

  <!-- QR Code 產生器 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }


    .container {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow:
        0 3px 15px rgba(0,0,0,0.1);
    }


    h1 {
      text-align: center;
      margin-bottom: 30px;
    }


    /* =========================
       選擇區域
       ========================= */
    .form-container {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }


    .form-group {
      flex: 1;
    }


    label {
      display: block;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;

    }


    select {
      width: 100%;
      font-size: 16px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;

    }


    /* =========================
       QR Code
       ========================= */

    .qr-container {
      margin-top: 25px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }


    #qrcode {
      min-height: 20px;
    }


    #qrcode img {
      border: 1px solid #ccc;
      padding: 10px;
      background: white;
    }


    #qr-text {
      font-size: 14px;
      color: #666;
      word-break: break-all;
    }


    /* =========================
       狀態
       ========================= */

    #status {
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .waiting {
      background: #eeeeee;
      color: #555;
    }

    .starting {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .finishing {
      background: #e3f2fd;
      color: #1565c0;
    }

    .error {
      background: #ffebee;
      color: #c62828;
    }


    /* =========================
       資料顯示
       ========================= */

    .data {

      font-size: 20px;

      margin: 12px 0;

    }

    .data-label {
      font-weight: bold;
    }

    .result {
      text-align: center;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      color: #666;
      font-size: 18px;
    }


    /* =========================
       隱藏
       ========================= */
    .hidden {
      display: none !important;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>IE Chair Production</h1>


  <!-- ==================================================
       MODE 1
       沒有 QR Code 參數
       → 顯示選單 + 產生 QR Code
       ================================================== -->

  <div id="selectionMode">
    <div class="form-container">
      <!-- Group -->
      <div class="form-group">
        <label for="group">
          Group 
        </label>
        <select id="group">
          <option value="">
            請選擇 Group
          </option>
          <option value="G01">G01</option>
          <option value="G02">G02</option>
          <option value="G03">G03</option>
          <option value="G04">G04</option>
          <option value="G05">G05</option>
          <option value="G06">G06</option>
        </select>
      </div>

      <!-- Product -->
      <div class="form-group">
        <label for="product">
          Product 
        </label>
        <select id="product">
          <option value="">
            請選擇 Product
          </option>
          <option value="P001">P001</option>
          <option value="P002">P002</option>
          <option value="P003">P003</option>
          <option value="P004">P004</option>
          <option value="P005">P005</option>
          <option value="P006">P006</option>
        </select>
      </div>

      <!-- Station -->
      <div class="form-group">
        <label for="station">
          Station 🏭
        </label>
        <select id="station">
          <option value="">
            請選擇 Station
          </option>
          <option value="ST01">ST01</option>
          <option value="ST02">ST02</option>
          <option value="ST03">ST03</option>
          <option value="ST04">ST04</option>
          <option value="ST05">ST05</option>
          <option value="ST06">ST06</option>
        </select>
      </div>
    </div>


    <div id="selectionStatus"
         class="message">
      請選擇 Group / Product / Station
    </div>


    <div class="qr-container">
      <div id="qrcode"></div>
      <p id="qr-text"></p>
    </div>
  </div>



  <!-- ==================================================
       MODE 2
       QR Code 掃描進入
       → 自動 START / FINISH
       ================================================== -->
  <div id="scanMode"
       class="hidden">
    <div class="result">
      <div class="data">
        <span class="data-label">
          Group：
        </span>
        <span id="scanGroup">
          ---
        </span>
      </div>


      <div class="data">
        <span class="data-label">
          Product：
        </span>
		
        <span id="scanProduct">
          ---
        </span>
      </div>


      <div class="data">
        <span class="data-label">
          Station：
        </span>

        <span id="scanStation">
          ---
        </span>
      </div>
    </div>


    <div id="status"
         class="waiting">
      處理中...
    </div>

    <div id="message"
         class="message">
    </div>
  </div>
</div>

<script>


// ==================================================
// Supabase 設定
// ==================================================

const SUPABASE_URL =
  "https://iomsrjkrvuzrsluirtdj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_QmLToEOs4wEEPBnASz0dxg_o0hhtgLO";


// ==================================================
// 判斷目前是哪一種模式
// ==================================================
const params =
  new URLSearchParams(
    window.location.search
  );

const group =
  params.get("group");
const product =
  params.get("product");
const station =
  params.get("station");


// ==================================================
// 有 QR Code 參數
// → 掃描模式
// ==================================================

if (group && product && station) {
  startScanMode();
}

// ==================================================
// 沒有參數
// → QR Code 產生模式
// ==================================================

else {
  startSelectionMode();
}

// ==================================================
// QR Code 產生模式
// ==================================================

function startSelectionMode() {
  const selectionMode =
    document.getElementById(
      "selectionMode"
    );

  selectionMode.classList.remove(
    "hidden"
  );

  const groupSelect =
    document.getElementById(
      "group"
    );

  const productSelect =
    document.getElementById(
      "product"
    );

  const stationSelect =
    document.getElementById(
      "station"
    );

  groupSelect.addEventListener(
    "change",
    generateQRCode
  );

  productSelect.addEventListener(
    "change",
    generateQRCode
  );

  stationSelect.addEventListener(
    "change",
    generateQRCode
  );
}


// ==================================================
// 產生 QR Code
// ==================================================

function generateQRCode() {
  const groupSelect =
    document.getElementById(
      "group"
    );

  const productSelect =
    document.getElementById(
      "product"
    );

  const stationSelect =
    document.getElementById(
      "station"
    );

  const qrcodeDiv =
    document.getElementById(
      "qrcode"
    );

  const qrText =
    document.getElementById(
      "qr-text"
    );

  const selectionStatus =
    document.getElementById(
      "selectionStatus"
    );

  const selectedGroup =
    groupSelect.value;

  const selectedProduct =
    productSelect.value;

  const selectedStation =
    stationSelect.value;


  // =========================
  // 尚未選完
  // =========================
  if (
    !selectedGroup ||
    !selectedProduct ||
    !selectedStation
  ) {

    qrcodeDiv.innerHTML = "";
    qrText.textContent = "";

    selectionStatus.textContent =
      "請選擇 Group / Product / Station";
    return;
  }


  // =========================
  // 建立 QR Code URL
  // =========================

  const targetUrl =
    window.location.origin +
    window.location.pathname +
    "?group=" +
    encodeURIComponent(
      selectedGroup
    ) +
    "&product=" +
    encodeURIComponent(
      selectedProduct
    ) +
    "&station=" +
    encodeURIComponent(
      selectedStation
    );


  console.log(
    "QR Code URL:",
    targetUrl
  );


  // 清除舊 QR
  qrcodeDiv.innerHTML = "";

  // 產生 QR Code
  new QRCode(
    qrcodeDiv,
    {
      text: targetUrl,
      width: 250,
      height: 250,
      correctLevel:
        QRCode.CorrectLevel.H
    }
  );


  // 顯示資訊
  qrText.textContent =
    `${selectedGroup} / ` +
    `${selectedProduct} / ` +
    `${selectedStation}`;


  selectionStatus.textContent =
    "QR Code 已產生，掃描即可執行";
}


// 掃描模式
async function startScanMode() {
  const selectionMode =
    document.getElementById(
      "selectionMode"
    );

  const scanMode =
    document.getElementById(
      "scanMode"
    );


  // 隱藏選單
  selectionMode.classList.add(
    "hidden"
  );
  // 顯示掃描結果

  scanMode.classList.remove(
    "hidden"
  );

  document.getElementById(
    "scanGroup"
  ).textContent =
    group;

  document.getElementById(
    "scanProduct"
  ).textContent =
    product;

  document.getElementById(
    "scanStation"
  ).textContent =
    station;


  // 自動執行
  await processScan();
}


// START / FINISH 判斷
async function processScan() {
  const status =
    document.getElementById(
      "status"
    );
	
  const message =
    document.getElementById(
      "message"
    );
  try {
    status.className =
      "waiting";
    status.textContent =
      "處理中...";
    message.textContent =
      "正在確認目前狀態";


    // 查詢是否存在尚未 FINISH 的資料
    const queryUrl =

      SUPABASE_URL +
      "/rest/v1/production_records" +

      "?group_code=eq." +
      encodeURIComponent(group) +

      "&product_code=eq." +
      encodeURIComponent(product) +

      "&station_code=eq." +
      encodeURIComponent(station) +

      "&finish_time=is.null" +

      "&select=*";

    const response =
      await fetch(
        queryUrl,
        {
          method: "GET",
          headers: {
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          }
        }
      );

    if (!response.ok) {
      throw new Error(
        "無法查詢資料庫"
      );
    }

    const records =
      await response.json();

    // 沒有未完成紀錄
    // → START
    if (
      records.length === 0
    ) {

      await doStart();
    }

    // 已經有未完成紀錄
    // → FINISH
    else {
      await doFinish(
        records[0]
      );
    }
  }

  catch (error) {
    console.error(
      error
    );


    status.className =
      "error";
    status.textContent =
      "✕ ERROR";
    message.textContent =
      error.message;
  }
}

// START


async function doStart() {
  const status =
    document.getElementById(
      "status"
    );

  const message =
    document.getElementById(
      "message"
    );

  const now =
    new Date().toISOString();

  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/production_records",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json",
          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            SUPABASE_KEY,

          "Prefer":
            "return=representation"

        },

        body: JSON.stringify({

          group_code:
            group,

          product_code:
            product,

          station_code:
            station,

          start_time:
            now,

          finish_time:
            null
        })
      }
    );


  if (!response.ok) {

    const errorText =
      await response.text();

    console.error(
      errorText
    );

    throw new Error(
      "START 寫入失敗"
    );

  }


  // 顯示 START
  status.className =
    "starting";
  status.textContent =
    "✓ START";
  message.textContent =
    "已開始生產";
}

// FINISH
async function doFinish(
  record
) {
  const status =
    document.getElementById(
      "status"
    );

  const message =
    document.getElementById(
      "message"
    );

  const now =
    new Date().toISOString();


  const updateUrl =

    SUPABASE_URL +
    "/rest/v1/production_records" +

    "?id=eq." +
    encodeURIComponent(
      record.id
    );

  const response =
    await fetch(
      updateUrl,
      {
        method: "PATCH",
        headers: {

          "Content-Type":
            "application/json",

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            SUPABASE_KEY,

          "Prefer":
            "return=representation"
        },

        body: JSON.stringify({
          finish_time:
            now
        })
      }
    );


  if (!response.ok) {
    const errorText =
      await response.text();
    console.error(
      errorText
    );
    throw new Error(
      "FINISH 寫入失敗"
    );
  }


  // 顯示 FINISH
  status.className =
    "finishing";
  status.textContent =
    "✓ FINISH";
  message.textContent =
    "已完成生產";
}
</script>
</body>
</html>
