<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>IE Chair Production</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px 20px;
      background: #f5f5f5;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 30px 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 30px;
    }

    .data {
      font-size: 20px;
      margin: 12px 0;
    }

    .label {
      font-weight: bold;
    }

    #status {
      margin-top: 30px;
      padding: 25px 10px;
      border-radius: 12px;
      font-size: 32px;
      font-weight: bold;
    }

    .starting {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .finishing {
      background: #e3f2fd;
      color: #1565c0;
    }

    .error {
      background: #ffebee;
      color: #c62828;
    }

    .loading {
      background: #eeeeee;
      color: #555;
    }

    #message {
      margin-top: 20px;
      font-size: 18px;
      color: #666;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>IE Chair Production</h1>


    <!-- QR Code 帶進來的資料 -->

    <div class="data">
      <span class="label">Group：</span>
      <span id="group">---</span>
    </div>

    <div class="data">
      <span class="label">Product：</span>
      <span id="product">---</span>
    </div>

    <div class="data">
      <span class="label">Station：</span>
      <span id="station">---</span>
    </div>


    <!-- 執行結果 -->

    <div id="status"
         class="loading">

      處理中...

    </div>


    <div id="message"></div>

  </div>


<script>


// ==================================================
// Supabase 設定
// ==================================================

const SUPABASE_URL =
  "https://iomsrjkrvuzrsluirtdj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_QmLToEOs4wEEPBnASz0dxg_o0hhtgLO";


// ==================================================
// HTML 元件
// ==================================================

const groupElement =
  document.getElementById("group");

const productElement =
  document.getElementById("product");

const stationElement =
  document.getElementById("station");

const statusElement =
  document.getElementById("status");

const messageElement =
  document.getElementById("message");


// ==================================================
// 從 QR Code URL 取得資料
// ==================================================

const params =
  new URLSearchParams(window.location.search);


const group =
  params.get("group");

const product =
  params.get("product");

const station =
  params.get("station");


// ==================================================
// 顯示 QR Code 帶進來的資料
// ==================================================

groupElement.textContent =
  group || "---";

productElement.textContent =
  product || "---";

stationElement.textContent =
  station || "---";


// ==================================================
// 檢查 QR Code 資料
// ==================================================

if (!group || !product || !station) {

  showError(
    "QR Code 資料不完整"
  );

} else {

  // 有資料
  // 直接開始執行

  processScan();

}


// ==================================================
// 掃描處理
// ==================================================

async function processScan() {

  try {

    statusElement.className =
      "loading";

    statusElement.textContent =
      "處理中...";


    // ==================================================
    // 查詢這個 Group / Product / Station
    // 是否存在尚未完成的紀錄
    // ==================================================

    const queryUrl =
      SUPABASE_URL +
      "/rest/v1/production_records" +

      "?group_code=eq." +
      encodeURIComponent(group) +

      "&product_code=eq." +
      encodeURIComponent(product) +

      "&station_code=eq." +
      encodeURIComponent(station) +

      "&finish_time=is.null" +

      "&select=*";


    const response =
      await fetch(queryUrl, {

        method: "GET",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY

        }

      });


    if (!response.ok) {

      throw new Error(
        "無法查詢資料庫"
      );

    }


    const records =
      await response.json();


    // ==================================================
    // 沒有進行中的紀錄
    //
    // → 第一次掃描
    // → START
    // ==================================================

    if (records.length === 0) {

      await startProduction();

    }

    // ==================================================
    // 已經有進行中的紀錄
    //
    // → 第二次掃描
    // → FINISH
    // ==================================================

    else {

      await finishProduction(
        records[0]
      );

    }

  }

  catch (error) {

    console.error(error);

    showError(
      error.message
    );

  }

}


// ==================================================
// START
// ==================================================

async function startProduction() {

  const now =
    new Date().toISOString();


  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/production_records",

      {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json",

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY,

          "Prefer":
            "return=representation"

        },

        body: JSON.stringify({

          group_code:
            group,

          product_code:
            product,

          station_code:
            station,

          start_time:
            now,

          finish_time:
            null

        })

      }

    );


  if (!response.ok) {

    throw new Error(
      "START 寫入失敗"
    );

  }


  // ==================================================
  // 顯示 START
  // ==================================================

  statusElement.className =
    "starting";

  statusElement.textContent =
    "✓ START";

  messageElement.textContent =
    "已開始生產";

}


// ==================================================
// FINISH
// ==================================================

async function finishProduction(record) {

  const now =
    new Date().toISOString();


  const updateUrl =
    SUPABASE_URL +
    "/rest/v1/production_records" +

    "?id=eq." +
    encodeURIComponent(record.id);


  const response =
    await fetch(

      updateUrl,

      {

        method: "PATCH",

        headers: {

          "Content-Type":
            "application/json",

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY,

          "Prefer":
            "return=representation"

        },

        body: JSON.stringify({

          finish_time:
            now

        })

      }

    );


  if (!response.ok) {

    throw new Error(
      "FINISH 寫入失敗"
    );

  }


  // ==================================================
  // 顯示 FINISH
  // ==================================================

  statusElement.className =
    "finishing";

  statusElement.textContent =
    "✓ FINISH";

  messageElement.textContent =
    "已完成生產";

}


// ==================================================
// 錯誤
// ==================================================

function showError(message) {

  statusElement.className =
    "error";

  statusElement.textContent =
    "✕ ERROR";

  messageElement.textContent =
    message;

}

</script>

</body>

</html>
